<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200"><rect width="840" height="200" rx="12" fill="#123d63"/><path d="M105 28l9 19 21 3-15 15 4 21-19-10-19 10 4-21-15-15 21-3z" fill="#8fd3ff"><animateTransform attributeName="transform" type="rotate" additive="sum" values="0 105 57;360 105 57" dur="1s" repeatCount="1" calcMode="spline" keyTimes="0;1" keySplines="0.42 0 0.58 1" begin="b.click"/></path><g id="b"><rect x="60" y="104" width="90" height="34" rx="17" fill="#f3e0de"/><text x="105" y="126" fill="#123d63" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Click me</text></g><text x="105" y="176" fill="#f3e0de" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">On click</text><rect id="a" x="281" y="40" width="68" height="68" rx="12" fill="#8fd3ff"><animateTransform attributeName="transform" type="rotate" additive="sum" values="0 315 74;360 315 74" dur="1.5s" repeatCount="indefinite" begin="a.mouseover" end="a.mouseout"/></rect><text x="315" y="176" fill="#f3e0de" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">On hover (point at it)</text><rect x="470" y="48" width="52" height="52" rx="10" fill="#8fd3ff"><animate attributeName="opacity" values="0;1;1" dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.3333;1" keySplines="0 0 0.58 1;0 0 0.58 1" begin="0s"/></rect><rect x="540" y="48" width="52" height="52" rx="10" fill="#f3e0de"><set attributeName="opacity" to="0" begin="0s"/><animateTransform attributeName="transform" type="translate" additive="sum" values="566 74;-56.6 -7.4;0 0;0 0" dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.1167;0.1667;1" keySplines="0 0 0.58 1;0 0 0.58 1;0 0 0.58 1" begin="1s"/><animateTransform attributeName="transform" type="scale" additive="sum" values="0;1.1;1;1" dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.1167;0.1667;1" keySplines="0 0 0.58 1;0 0 0.58 1;0 0 0.58 1" begin="1s"/><animate