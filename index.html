<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Svgcraft</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Applied before first paint so a saved Dark / Light choice never flashes. -->
    <script>
      try {
        const t = localStorage.getItem('svgcraft.theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch {
        /* storage blocked — follow the OS theme */
      }
    </script>
  </head>
  <body>
    <!-- ── Menu bar ─────────────────────────────────────────────────────── -->
    <header class="sc-menubar">
      <span class="sc-logo" aria-hidden="true">Sc</span>
      <nav class="sc-menus" role="menubar" aria-label="Main menu">
        <div class="sc-menu">
          <button class="sc-menu-btn" role="menuitem" aria-haspopup="menu" aria-expanded="false">
            File
          </button>
          <div class="sc-menu-list" role="menu" hidden>
            <button role="menuitem" data-action="new">
              <i data-icon="file"></i><span>New</span>
            </button>
            <button role="menuitem" data-action="open">
              <i data-icon="folder-open"></i><span>Open…</span><kbd>Ctrl+O</kbd>
            </button>
            <button role="menuitem" data-action="place">
              <i data-icon="file-import"></i><span>Import…</span>
            </button>
            <hr />
            <button role="menuitem" data-action="exportSvg">
              <i data-icon="file-export"></i><span>Export SVG</span><kbd>Ctrl+S</kbd>
            </button>
            <button role="menuitem" data-action="exportPng1">
              <i data-icon="image"></i><span>Export PNG @1×</span>
            </button>
            <button role="menuitem" data-action="exportPng2">
              <i></i><span>Export PNG @2×</span>
            </button>
            <button role="menuitem" data-action="exportPng4">
              <i></i><span>Export PNG @4×</span>
            </button>
            <hr />
            <button role="menuitem" data-action="copySvg">
              <i data-icon="copy"></i><span>Copy as SVG markup</span>
            </button>
          </div>
        </div>
        <div class="sc-menu">
          <button class="sc-menu-btn" role="menuitem" aria-haspopup="menu" aria-expanded="false">
            Edit
          </button>
          <div class="sc-menu-list" role="menu" hidden>
            <button role="menuitem" data-action="undo">
              <i data-icon="rotate-left"></i><span>Undo</span><kbd>Ctrl+Z</kbd>
            </button>
            <button role="menuitem" data-action="redo">
              <i data-icon="rotate-right"></i><span>Redo</span><kbd>Ctrl+Shift+Z</kbd>
            </button>
            <hr />
            <button role="menuitem" data-action="duplicate">
              <i data-icon="clone"></i><span>Duplicate</span><kbd>Ctrl+D</kbd>
            </button>
            <button role="menuitem" data-action="delete">
              <i data-icon="trash-can"></i><span>Delete</span><kbd>Del</kbd>
            </button>
            <hr />
            <button role="menuitem" data-action="selectAll">
              <i></i><span>Select All</span><kbd>Ctrl+A</kbd>
            </button>
            <button role="menuitem" data-action="deselect">
              <i></i><span>Deselect</span><kbd>Esc</kbd>
            </button>
            <hr />
            <button role="menuitem" data-action="swapPaint">
              <i data-icon="right-left"></i><span>Swap Fill and Stroke</span><kbd>X</kbd>
            </button>
          </div>
        </div>
        <div class="sc-menu">
          <button class="sc-menu-btn" role="menuitem" aria-haspopup="menu" aria-expanded="false">
            Object
          </button>
          <div class="sc-menu-list" role="menu" hidden>
            <button role="menuitem" data-action="group">
              <i data-icon="object-group"></i><span>Group</span><kbd>Ctrl+G</kbd>
            </button>
            <button role="menuitem" data-action="ungroup">
              <i data-icon="object-ungroup"></i><span>Ungroup</span><kbd>Ctrl+Shift+G</kbd>
            </button>
            <hr />
            <button role="menuitem" data-action="front">
              <i data-icon="angles-up"></i><span>Bring to Front</span><kbd>Ctrl+]</kbd>
            </button>
            <button role="menuitem" data-action="forward">
              <i data-icon="arrow-up"></i><span>Bring Forward</span><kbd>]</kbd>
            </button>
            <button role="menuitem" data-action="backward">
              <i data-icon="arrow-down"></i><span>Send Backward</span><kbd>[</kbd>
            </button>
            <button role="menuitem" data-action="back">
              <i data-icon="angles-down"></i><span>Send to Back</span><kbd>Ctrl+[</kbd>
            </button>
            <hr />
            <button role="menuitem" data-action="flipH">
              <i data-icon="left-right"></i><span>Flip Horizontal</span>
            </button>
            <button role="menuitem" data-action="flipV">
              <i data-icon="up-down"></i><span>Flip Vertical</span>
            </button>
          </div>
        </div>
        <div class="sc-menu">
          <button class="sc-menu-btn" role="menuitem" aria-haspopup="menu" aria-expanded="false">
            View
          </button>
          <div class="sc-menu-list" role="menu" hidden>
            <button role="menuitem" data-action="zoomIn">
              <i data-icon="magnifying-glass-plus"></i><span>Zoom In</span><kbd>+</kbd>
            </button>
            <button role="menuitem" data-action="zoomOut">
              <i data-icon="magnifying-glass-minus"></i><span>Zoom Out</span><kbd>−</kbd>
            </button>
            <button role="menuitem" data-action="fit">
              <i data-icon="expand"></i><span>Fit on Screen</span><kbd>0</kbd>
            </button>
            <button role="menuitem" data-action="zoom100">
              <i></i><span>100%</span><kbd>1</kbd>
            </button>
            <hr />
            <button role="menuitemcheckbox" data-action="toggleGrid" aria-checked="false">
              <i data-icon="border-all"></i><span>Show Grid</span>
            </button>
            <button role="menuitemcheckbox" data-action="toggleSnap" aria-checked="false">
              <i data-icon="magnet"></i><span>Snap to Grid</span>
            </button>
            <hr />
            <span class="sc-menu-label">Theme</span>
            <button role="menuitemradio" data-action="themeSystem" data-theme-opt="system">
              <i data-icon="circle-half-stroke"></i><span>Match System</span>
            </button>
            <button role="menuitemradio" data-action="themeDark" data-theme-opt="dark">
              <i data-icon="moon"></i><span>Dark</span>
            </button>
            <button role="menuitemradio" data-action="themeLight" data-theme-opt="light">
              <i data-icon="sun"></i><span>Light</span>
            </button>
          </div>
        </div>
      </nav>
      <div class="sc-menubar-end">
        <button
          class="sc-ibtn"
          data-action="undo"
          aria-label="Undo"
          data-tip="Undo · Ctrl+Z"
          id="sc-undo"
        >
          <i data-icon="rotate-left"></i>
        </button>
        <button
          class="sc-ibtn"
          data-action="redo"
          aria-label="Redo"
          data-tip="Redo · Ctrl+Shift+Z"
          id="sc-redo"
        >
          <i data-icon="rotate-right"></i>
        </button>
        <button
          class="sc-ibtn"
          data-action="toggleTheme"
          aria-label="Switch theme"
          data-tip="Switch dark / light"
          id="sc-theme-btn"
        >
          <i data-icon="moon"></i>
        </button>
        <button class="sc-export" data-action="exportSvg" data-tip="Download SVG · Ctrl+S">
          <i data-icon="file-export"></i><span>Export</span>
        </button>
        <button
          class="sc-ibtn sc-panel-toggle"
          id="sc-panel-toggle"
          aria-label="Show panels"
          aria-expanded="false"
        >
          <i data-icon="sliders"></i>
        </button>
      </div>
      <input
        id="sc-file"
        type="file"
        accept=".svg,image/svg+xml,image/png,image/jpeg,image/webp,image/gif"
        hidden
      />
    </header>

    <!-- ── Options bar (changes with the tool) ──────────────────────────── -->
    <div class="sc-options" id="sc-options">
      <div class="sc-opt-tool"><i id="sc-opt-icon"></i><span id="sc-opt-name">Move</span></div>
      <span class="sc-vsep"></span>
      <div class="sc-opt" data-for="select">
        <button
          class="sc-ibtn"
          data-action="flipH"
          aria-label="Flip horizontal"
          data-tip="Flip horizontal"
        >
          <i data-icon="left-right"></i>
        </button>
        <button
          class="sc-ibtn"
          data-action="flipV"
          aria-label="Flip vertical"
          data-tip="Flip vertical"
        >
          <i data-icon="up-down"></i>
        </button>
        <span class="sc-vsep"></span>
        <button class="sc-ibtn" data-action="group" aria-label="Group" data-tip="Group · Ctrl+G">
          <i data-icon="object-group"></i>
        </button>
        <button
          class="sc-ibtn"
          data-action="ungroup"
          aria-label="Ungroup"
          data-tip="Ungroup · Ctrl+Shift+G"
        >
          <i data-icon="object-ungroup"></i>
        </button>
        <span class="sc-vsep"></span>
        <button
          class="sc-ibtn"
          data-action="front"
          aria-label="Bring to front"
          data-tip="Bring to front · Ctrl+]"
        >
          <i data-icon="angles-up"></i>
        </button>
        <button
          class="sc-ibtn"
          data-action="forward"
          aria-label="Bring forward"
          data-tip="Bring forward · ]"
        >
          <i data-icon="arrow-up"></i>
        </button>
        <button
          class="sc-ibtn"
          data-action="backward"
          aria-label="Send backward"
          data-tip="Send backward · ["
        >
          <i data-icon="arrow-down"></i>
        </button>
        <button
          class="sc-ibtn"
          data-action="back"
          aria-label="Send to back"
          data-tip="Send to back · Ctrl+["
        >
          <i data-icon="angles-down"></i>
        </button>
      </div>
      <div class="sc-opt" data-for="node">
        <button class="sc-tbtn" data-node-cmd="corner" data-tip="Retract handles — sharp point">
          <i data-icon="crosshairs"></i>Corner
        </button>
        <button class="sc-tbtn" data-node-cmd="smooth" data-tip="Grow smooth handles">
          <i data-icon="bezier-curve"></i>Smooth
        </button>
        <button class="sc-tbtn" data-node-cmd="delete" data-tip="Delete points · Del">
          <i data-icon="trash-can"></i>Delete
        </button>
        <button class="sc-tbtn" data-node-cmd="close" data-tip="Close or open the path">
          <i data-icon="draw-polygon"></i>Close / open
        </button>
      </div>
      <div class="sc-opt" data-for="pencil pen rect ellipse line">
        <label class="sc-field"
          ><span class="sc-scrub" data-tip="Drag to adjust">Stroke:</span
          ><input
            type="number"
            data-bind="strokeWidth"
            min="0"
            max="200"
            step="0.5"
            aria-label="Stroke width"
          /><span class="sc-unit">px</span></label
        >
      </div>
      <div class="sc-opt" data-for="pencil">
        <label class="sc-field"
          ><span class="sc-scrub" data-tip="Drag to adjust">Smoothing:</span
          ><input id="sc-smooth" type="number" min="0" max="10" value="4" aria-label="Smoothing"
        /></label>
      </div>
      <div class="sc-opt" data-for="eraser">
        <div class="sc-seg" role="radiogroup" aria-label="Eraser mode">
          <button data-eraser="object" role="radio">Object</button>
          <button data-eraser="cut" role="radio">Cut</button>
        </div>
        <label class="sc-field"
          ><span class="sc-scrub" data-tip="Drag to adjust">Size:</span
          ><input
            id="sc-eraser-size"
            type="number"
            min="2"
            max="80"
            value="12"
            aria-label="Eraser size"
          /><span class="sc-unit">px</span></label
        >
        <span class="sc-opt-note">Object deletes what you rub · Cut splits strokes</span>
      </div>
      <div class="sc-opt" data-for="text">
        <label class="sc-field"
          ><span class="sc-scrub" data-tip="Drag to adjust">Size:</span
          ><input
            id="sc-font-size"
            type="number"
            min="6"
            max="400"
            value="32"
            aria-label="Font size"
          /><span class="sc-unit">px</span></label
        >
      </div>
      <div class="sc-opt" data-for="hand">
        <button class="sc-tbtn" data-action="zoom100">100%</button>
        <button class="sc-tbtn" data-action="fit">Fit Screen</button>
      </div>
    </div>

    <div class="sc-main">
      <!-- ── Toolbar ────────────────────────────────────────────────────── -->
      <nav class="sc-tools" aria-label="Tools">
        <button data-tool="select" aria-label="Move / select" data-tip="Move · V">
          <i data-icon="arrow-pointer"></i>
        </button>
        <button data-tool="node" aria-label="Edit points" data-tip="Edit points · A">
          <i data-icon="bezier-curve"></i>
        </button>
        <span class="sc-sep"></span>
        <button data-tool="pencil" aria-label="Pencil" data-tip="Pencil · P">
          <i data-icon="pencil"></i>
        </button>
        <button data-tool="pen" aria-label="Pen" data-tip="Pen · B">
          <i data-icon="pen-nib"></i>
        </button>
        <button data-tool="eraser" aria-label="Eraser" data-tip="Eraser · E">
          <i data-icon="eraser"></i>
        </button>
        <span class="sc-sep"></span>
        <button data-tool="rect" aria-label="Rectangle" data-tip="Rectangle · R">
          <i data-icon="square"></i>
        </button>
        <button data-tool="ellipse" aria-label="Ellipse" data-tip="Ellipse · O">
          <i data-icon="circle"></i>
        </button>
        <button data-tool="line" aria-label="Line" data-tip="Line · L">
          <i data-icon="slash"></i>
        </button>
        <button data-tool="text" aria-label="Text" data-tip="Type · T">
          <i data-icon="font"></i>
        </button>
        <span class="sc-sep"></span>
        <button data-tool="hand" aria-label="Hand" data-tip="Hand · H (or hold Space)">
          <i data-icon="hand"></i>
        </button>
        <!-- Fill / stroke chips, Photoshop foreground / background style. -->
        <div class="sc-chips" aria-label="Fill and stroke">
          <button
            id="sc-tb-stroke"
            class="sc-tb-chip sc-tb-stroke"
            aria-label="Stroke colour (make active)"
            data-tip="Stroke · click to edit"
          ></button>
          <button
            id="sc-tb-fill"
            class="sc-tb-chip sc-tb-fill"
            aria-label="Fill colour (make active)"
            data-tip="Fill · click to edit"
          ></button>
          <button
            class="sc-tb-mini sc-tb-swap"
            data-action="swapPaint"
            aria-label="Swap fill and stroke"
            data-tip="Swap · X"
          >
            <i data-icon="right-left"></i>
          </button>
          <button
            class="sc-tb-mini sc-tb-none"
            data-action="paintNone"
            aria-label="Set the active paint to none"
            data-tip="None"
          >
            <i data-icon="ban"></i>
          </button>
        </div>
      </nav>

      <!-- ── Document window ────────────────────────────────────────────── -->
      <div class="sc-workspace">
        <div class="sc-doctabs" role="tablist">
          <div class="sc-doctab" role="tab" aria-selected="true">
            <span id="sc-doc-title">drawing.svg @ 100%</span>
          </div>
        </div>
        <div class="sc-stage-wrap" id="sc-stage-wrap">
          <svg id="sc-stage" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <pattern id="sc-checker" patternUnits="userSpaceOnUse" width="16" height="16">
                <rect width="16" height="16" class="sc-check-a" />
                <rect width="8" height="8" class="sc-check-b" />
                <rect x="8" y="8" width="8" height="8" class="sc-check-b" />
              </pattern>
              <pattern id="sc-gridpat" patternUnits="userSpaceOnUse" width="20" height="20">
                <path id="sc-gridline" d="M20 0H0V20" fill="none" class="sc-gridline" />
              </pattern>
            </defs>
            <g id="sc-view">
              <rect id="sc-board-bg" x="0" y="0" width="800" height="600" fill="url(#sc-checker)" />
              <rect
                id="sc-grid-rect"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="url(#sc-gridpat)"
                display="none"
              />
              <defs id="sc-defs"></defs>
              <g id="sc-doc"></g>
              <rect id="sc-board-frame" x="0" y="0" width="800" height="600" fill="none" />
              <g id="sc-selection"></g>
              <g id="sc-nodes"></g>
              <g id="sc-guides"></g>
            </g>
          </svg>
          <div class="sc-drop" id="sc-drop">Drop an SVG or image to import</div>
        </div>
      </div>

      <!-- ── Panels ─────────────────────────────────────────────────────── -->
      <aside class="sc-panel" id="sc-panel" aria-label="Panels">
        <section class="sc-pgroup" data-tabs>
          <div class="sc-ptabs" role="tablist">
            <button role="tab" aria-selected="true" data-tab="color">Color</button>
            <button role="tab" aria-selected="false" data-tab="swatches">Swatches</button>
          </div>
          <div class="sc-pbody" data-pane="color">
            <div class="sc-paint" data-target="fill">
              <div class="sc-paint-head">
                <button
                  class="sc-chip"
                  id="sc-fill-chip"
                  aria-label="Make fill the active paint"
                ></button>
                <span>Fill</span>
                <label class="sc-check"><input id="sc-fill-on" type="checkbox" checked /> On</label>
                <input id="sc-fill-color" type="color" value="#e8a33d" aria-label="Fill colour" />
                <input
                  id="sc-fill-hex"
                  class="sc-hex"
                  value="#e8a33d"
                  aria-label="Fill hex"
                  spellcheck="false"
                />
              </div>
              <label class="sc-row"
                >Alpha <input id="sc-fill-a" type="range" min="0" max="100" value="100" /><output
                  id="sc-fill-a-out"
                  >100%</output
                ></label
              >
            </div>
            <div class="sc-paint" data-target="stroke">
              <div class="sc-paint-head">
                <button
                  class="sc-chip"
                  id="sc-stroke-chip"
                  aria-label="Make stroke the active paint"
                ></button>
                <span>Stroke</span>
                <label class="sc-check"
                  ><input id="sc-stroke-on" type="checkbox" checked /> On</label
                >
                <input
                  id="sc-stroke-color"
                  type="color"
                  value="#1f2933"
                  aria-label="Stroke colour"
                />
                <input
                  id="sc-stroke-hex"
                  class="sc-hex"
                  value="#1f2933"
                  aria-label="Stroke hex"
                  spellcheck="false"
                />
              </div>
              <label class="sc-row"
                >Alpha <input id="sc-stroke-a" type="range" min="0" max="100" value="100" /><output
                  id="sc-stroke-a-out"
                  >100%</output
                ></label
              >
            </div>
          </div>
          <div class="sc-pbody" data-pane="swatches" hidden>
            <div class="sc-palette" id="sc-palette" aria-label="Swatches"></div>
            <p class="sc-hint">
              A swatch goes to the active paint. Shift-click sends it to the other one.
            </p>
          </div>
        </section>

        <section class="sc-pgroup">
          <div class="sc-ptabs"><span class="sc-ptitle">Properties</span></div>
          <div class="sc-pbody">
            <div class="sc-prop-grid">
              <label class="sc-field"
                ><span class="sc-scrub" data-tip="Drag to adjust">Stroke</span
                ><input
                  type="number"
                  data-bind="strokeWidth"
                  min="0"
                  max="200"
                  step="0.5"
                  aria-label="Stroke width"
                /><span class="sc-unit">px</span></label
              >
              <span></span>
              <label class="sc-field"
                ><span class="sc-scrub" data-tip="Drag to adjust">W</span
                ><input
                  id="sc-w"
                  type="number"
                  min="1"
                  max="20000"
                  value="800"
                  aria-label="Document width"
                /><span class="sc-unit">px</span></label
              >
              <label class="sc-field"
                ><span class="sc-scrub" data-tip="Drag to adjust">H</span
                ><input
                  id="sc-h"
                  type="number"
                  min="1"
                  max="20000"
                  value="600"
                  aria-label="Document height"
                /><span class="sc-unit">px</span></label
              >
              <label class="sc-check"><input id="sc-grid" type="checkbox" /> Grid</label>
              <label class="sc-check"><input id="sc-snap" type="checkbox" /> Snap</label>
              <label class="sc-field"
                ><span class="sc-scrub" data-tip="Drag to adjust">Grid</span
                ><input
                  id="sc-grid-size"
                  type="number"
                  min="2"
                  max="500"
                  value="20"
                  aria-label="Grid size"
                /><span class="sc-unit">px</span></label
              >
            </div>
            <p class="sc-hint sc-prop-note">W and H set the document (artboard) size.</p>
          </div>
        </section>

        <section class="sc-pgroup sc-grow">
          <div class="sc-ptabs"><span class="sc-ptitle">Layers</span></div>
          <div class="sc-layers-head">
            <label class="sc-field"
              ><span class="sc-scrub" data-tip="Drag to adjust">Opacity:</span
              ><input
                type="number"
                data-bind="opacity"
                min="0"
                max="100"
                aria-label="Opacity"
              /><span class="sc-unit">%</span></label
            >
          </div>
          <ol class="sc-layers" id="sc-layers"></ol>
          <div class="sc-layers-foot">
            <button
              class="sc-ibtn"
              data-action="group"
              aria-label="Group"
              data-tip="Group · Ctrl+G"
            >
              <i data-icon="folder"></i>
            </button>
            <button
              class="sc-ibtn"
              data-action="duplicate"
              aria-label="Duplicate"
              data-tip="Duplicate · Ctrl+D"
            >
              <i data-icon="clone"></i>
            </button>
            <button
              class="sc-ibtn"
              data-action="forward"
              aria-label="Bring forward"
              data-tip="Bring forward · ]"
            >
              <i data-icon="arrow-up"></i>
            </button>
            <button
              class="sc-ibtn"
              data-action="backward"
              aria-label="Send backward"
              data-tip="Send backward · ["
            >
              <i data-icon="arrow-down"></i>
            </button>
            <button
              class="sc-ibtn"
              data-action="delete"
              aria-label="Delete"
              data-tip="Delete · Del"
            >
              <i data-icon="trash-can"></i>
            </button>
          </div>
        </section>
      </aside>
    </div>

    <!-- ── Status bar ─────────────────────────────────────────────────────── -->
    <footer class="sc-status">
      <label class="sc-zoom"
        ><input
          id="sc-zoom-input"
          value="100"
          aria-label="Zoom percent"
          inputmode="decimal"
        />%</label
      >
      <span id="sc-docsize" class="sc-docsize">800 × 600 px</span>
      <span id="sc-hint"></span>
