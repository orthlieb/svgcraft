<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560">
  <title>Sunset over the hills</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#9d174d"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <path id="arc" d="M130 260 A340 340 0 0 1 670 260" fill="none"/>
  </defs>
  <rect id="skyBg" data-name="Sky" width="800" height="560" fill="url(#sky)"/>
  <g id="stars" data-name="Stars" fill="#ffffff" opacity="0.8">
    <circle cx="90" cy="70" r="2"/><circle cx="160" cy="130" r="1.5"/><circle cx="260" cy="50" r="2.5"/>
    <circle cx="540" cy="80" r="2"/><circle cx="640" cy="40" r="1.5"/><circle cx="720" cy="120" r="2.5"/>
    <circle cx="420" cy="30" r="1.5"/><circle cx="350" cy="110" r="1"/><circle cx="600" cy="150" r="1"/>
  </g>
  <circle id="sunDisc" data-name="Sun" cx="400" cy="330" r="120" fill="url(#sun)"
    data-sc-fx='{"og":{"c":"#fde68a","o":75,"sp":10,"s":40}}'/>
  <path id="far" data-name="Far hills" fill="url(#hillFar)"
    d="M0 380 C120 300 220 330 320 360 C420 390 520 300 640 320 C720 335 760 360 800 350 V560 H0 Z"/>
  <path id="near" data-name="Near hills" fill="url(#hillNear)"
    d="M0 450 C140 400 260 420 380 460 C500 500 620 410 800 430 V560 H0 Z"/>
  <text id="title" data-name="Title" font-family="Georgia, serif" font-size="58" font-weight="700"
    letter-spacing="8" fill="#fff7ed" text-anchor="middle"
    data-sc-fx='{"ds":{"c":"#1e1b4b","o":60,"a":120,"d":4,"sp":0,"s":6}}'><textPath href="#arc" startOffset="50%">SVGCRAFT</textPath></text>
  <rect id="frame" data-name="Frame" x="24" y="24" width="752" height="512" rx="18" fill="none"
    stroke="#fff7ed" stroke-opacity="0.7" stroke-width="3" stroke-dasharray="12 9" data-dash="4 3"/>
</svg>
